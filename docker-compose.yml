services:
  postgres:
    image: postgres:18-alpine
    container_name: shiftbid-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespw
      POSTGRES_DB: auctions
    ports:
      - "5432:5432"
    volumes:
      - shiftbid-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auctions"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  auction-service:
    image: auction-service
    container_name: shiftbid-auction-service
    build:
      context: ./ShiftBid
      dockerfile: AuctionService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=auctions;User Id=postgres;Password=postgrespw;
      - RabbitMQ__Host=rabbitmq
      - IdentityServiceUrl=http://identity-service:5000
    ports:
      - "7001:7001"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  search-service:
    image: search-service
    container_name: shiftbid-search-service
    build:
      context: ./ShiftBid
      dockerfile: SearchService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Meilisearch__Url=http://meilisearch:7700
      - Meilisearch__Key=masterKey123!
      - AuctionSvcUrl=http://auction-service:7001
      - RabbitMQ__Host=rabbitmq
    ports:
      - "7002:7002"
    depends_on:
      meilisearch:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: shiftbid-meilisearch
    environment:
      - MEILI_MASTER_KEY=masterKey123!
    ports:
      - "7700:7700"
    volumes:
      - shiftbid-meili-data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: shiftbid-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - shiftbid-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
  identity-service:
    image: identity-service
    container_name: shiftbid-identity-service
    build:
      context: ./ShiftBid
      dockerfile: IdentityService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=identity;User Id=postgres;Password=postgrespw;
    volumes:
      - shiftbid-identity-signing-keys:/app/keys
      - shiftbid-identity-data-protection-keys:/app/data-protection-keys
    ports:
      - "5001:5000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  gateway-service:
    image: gateway-service
    container_name: shiftbid-gateway-service
    build:
      context: ./ShiftBid
      dockerfile: GatewayService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
    ports:
      - "6001:6001"
    depends_on:
      - auction-service
      - search-service
      - identity-service
    restart: unless-stopped

volumes:
  shiftbid-pgdata:
  shiftbid-meili-data:
  shiftbid-rabbitmq-data:
  shiftbid-identity-signing-keys:
  shiftbid-identity-data-protection-keys:
