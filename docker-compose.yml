services:
  postgres:
    image: postgres:18-alpine
    container_name: shiftbid-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespw
      POSTGRES_DB: auctions
    ports:
      - "5432:5432"
    volumes:
      - shiftbid-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auctions"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  auction-service:
    image: auction-service
    container_name: shiftbid-auction-service
    build:
      context: ./ShiftBid/AuctionService
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=auctions;User Id=postgres;Password=postgrespw;
    ports:
      - "7001:7001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  shiftbid-pgdata:
